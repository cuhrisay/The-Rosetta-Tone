name: Deploy to Infomaniak

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Inject secrets
        env:
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAILCHIMP_API_KEY: ${{ secrets.MAILCHIMP_API_KEY }}
        run: |
          python3 -c "
          import os
          for path in ['./dist/application.php', './dist/free-guide.php', './dist/contact.php']:
              with open(path, 'r') as f:
                  content = f.read()
              content = content.replace('__SMTP_PASSWORD__', os.environ['SMTP_PASSWORD'])
              content = content.replace('__MAILCHIMP_API_KEY__', os.environ.get('MAILCHIMP_API_KEY', ''))
              with open(path, 'w') as f:
                  f.write(content)
          "

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftp
          local-dir: ./dist/
